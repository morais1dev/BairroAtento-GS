spring:
  application:
    name: bairro-atento
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
bairroatento:
  etapas:
    # Mínimo de respostas para confirmar/reabrir/fechar uma etapa quando o bairro
    # da ocorrência não tem linha em config_regiao.
    minimo-padrao: 10
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/bairroatento-dev;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:bairroatento-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
